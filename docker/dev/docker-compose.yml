services:
  karynos-db:
    container_name: "${POSTGRES_SERVER:-karynos-db}"
    image: postgres:17.5
    restart: unless-stopped
    networks:
      - karynos-network
    environment:
      POSTGRES_USER: "${POSTGRES_USER:-karynos}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-karynos}"
      POSTGRES_DB: "${POSTGRES_DB:-karynos}"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-karynos} -d ${POSTGRES_DB:-karynos}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - ../../db/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
      - ../../db-data/postgres:/var/lib/postgresql/data

  qdrant:
    container_name: karynos-qdrant
    image: qdrant/qdrant:latest
    restart: unless-stopped
    networks:
      - karynos-network
    ports:
      - "6333:6333"
    volumes:
      - qdrant-data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/6333' 2>/dev/null"]
      interval: 5s
      timeout: 5s
      start_period: 30s
      retries: 10

  backend-app:
    container_name: backend-app
    image: karynos/be-python-base:latest
    restart: unless-stopped
    networks:
      - karynos-network
    depends_on:
      karynos-db:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    env_file:
      - ../../.env.local
    ports:
      - "8000:8000"
    volumes:
      - ../..:/app
      - prisma-binary:/root/.cache/prisma-python
    command: ["sh", "/app/scripts/start-backend-dev.sh"]

networks:
  karynos-network:
    driver: bridge

volumes:
  prisma-binary:
  qdrant-data:
