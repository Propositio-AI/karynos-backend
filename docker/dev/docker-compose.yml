    build:
      context: ../../services/mentor_service
    # ports:
    #   - "${MENTOR_SERVICE_HOST_PORT}:${MENTOR_SERVICE_DOCKER_PORT}"
    networks:
      - karynos-network
    depends_on:
      - mentor-db
    env_file:
      - ../../services/mentor_service/.mentor_env
    environment:
      - "POSTGRES_SERVER=${MENTOR_DB_SERVER_NAME}"
    volumes:
      - ../../services/mentor_service/app:/app
      - ../../shared:/app/shared
    command: ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "${MENTOR_SERVICE_DOCKER_PORT}", "--reload"]

