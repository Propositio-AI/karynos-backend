services:
  # Job Service
  job-db:
    container_name: "${JOB_DB_SERVER_NAME}" 
    image: postgres:17.5
    ports:
      - "5432:5432"
    networks:
      - karynos-network
    env_file:
      - ../../services/job_service/.job_env
    volumes:
      - ../../services/job_service/db/:/docker-entrypoint-initdb.d/
      - ../../services/job_service/db-data:/var/lib/postgresql/data

  job-service:
    container_name: "job-service"
    build:
      context: ../../services/job_service
    # ports:
    #   - "${JOB_SERVICE_HOST_PORT}:${JOB_SERVICE_DOCKER_PORT}"
    networks:
      - karynos-network
    depends_on:
      - job-db
    env_file:
      - ../../services/job_service/.job_env
    environment:
      - "POSTGRES_SERVER=${JOB_DB_SERVER_NAME}"
    volumes:
      - ../../services/job_service/app:/app
      - ../../shared:/app/shared
    command: ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "${JOB_SERVICE_DOCKER_PORT}", "--reload"]

  # Mentor Service
  mentor-db:
    container_name: "${MENTOR_DB_SERVER_NAME}" 
    image: postgres:17.5
    networks:
      - karynos-network
    env_file:
      - ../../services/mentor_service/.mentor_env
    volumes:
      - ../../services/mentor_service/db/init.sql:/docker-entrypoint-initdb.d/init.sql
      - ../../services/mentor_service/db-data:/var/lib/postgresql/data

  mentor-service:
