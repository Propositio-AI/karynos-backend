services:
  app:
    container_name: "memo-service"
    build: .
    ports:
      - "${APP_PORT}:8000"
    depends_on:
      - memo-db
    env_file:
      - .env_dev
    volumes:
      - ./app:/app
    command: ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]

  memo-db:
    container_name: "memo-db" 
    image: postgres:17.5
    environment:
      - TZ=Asia/Tokyo
    env_file:
      - .env_dev
    volumes:
      - ./test/db-data:/var/lib/postgresql/data

volumes:
  db-data:
    driver: local