services:
  app:
    container_name: "auth-service"
    build: .
    ports:
      - "${HOST_PORT}:${DOCKER_PORT}"
    networks:
      - karynos-network
    depends_on:
      - auth-db
    volumes:
      - ./app:/app
      - ../../shared:/app/shared
      - ./keys:/app/keys
    env_file:
      - .env
    command: ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "${DOCKER_PORT}", "--reload"]

  auth-db:
    container_name: "auth-db" 
    image: postgres:17.5
    networks:
      - karynos-network
    environment:
      - TZ=Asia/Tokyo
    env_file:
      - .env
    volumes:
      - ./test/db-data:/var/lib/postgresql/data

volumes:
  db-data:
    driver: local

networks:
  karynos-network:
    external: true