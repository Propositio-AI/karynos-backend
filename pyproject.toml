[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "karynos-backend"
version = "0.1.0"
description = "Unified backend application migrated from service-based structure"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "qdrant-client",
  "fastapi",
  "black",
  "openai",
  "openapi-python-client",
  "prisma",
  "psycopg2-binary",
  "pydantic-settings",
  "python-dateutil",
  "python-dotenv",
  "python-multipart",
  "requests",
  "sqlalchemy",
  "uuid6",
  "uvicorn",
  "websockets",
  "posthog",
]

[tool.black]
line-length = 88
target-version = ["py312"]
exclude = '''
/(
    \.git
  | __pycache__
  | app/gen
  | karynos-backend-client
)/
'''

[tool.ruff]
line-length = 88
target-version = "py312"
exclude = [
  ".git",
  "__pycache__",
  "app/gen",
  "karynos-backend-client",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]

[tool.uv]
package = false

[tool.setuptools.packages.find]
include = ["app*", "backend*", "algorithm*"]
